# Deploy the CRA production build (folder `build/`) to GitHub Pages.
#
# Required repo setting: Settings → Pages → Build and deployment → Source must be
# "GitHub Actions". If Source is "Deploy from a branch", GitHub will serve Jekyll
# from the repo root instead of this artifact, and the React app will not appear.
#
# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel older queued runs so a stuck job cannot block new pushes for hours.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install
        run: npm ci
      # CRA produces static assets in `build/`. GitHub Pages serves that folder.
      # Use `npm run build` only — not `predeploy` (`react-snap` needs Chrome and
      # often fails on Actions, which blocks deployment entirely.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          CI: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "build"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4